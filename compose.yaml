services:
  csharp-requestrr_webapi:
    build:
      context: ./Requestrr.WebApi
      dockerfile: ../Requestrr.WebApiDockerfile
    container_name: csharp-requestrr_webapi
    restart: unless-stopped
    init: true
    ports:
      - "5000:5000"  # Exposes the ASP.NET Core default port

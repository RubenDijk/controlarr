# =============================================================================
# Controlarr - Docker Compose for Unraid
# =============================================================================
# 
# Usage:
#   docker compose up -d --build
#
# Access the web interface at: http://your-server-ip:4545
# =============================================================================

services:
  controlarr:
    build:
      context: .
      dockerfile: ./Requestrr.WebApi/dockerfile
    container_name: controlarr
    restart: unless-stopped
    ports:
      - "4545:4545"
    volumes:
      # Persistent configuration - change path for your Unraid setup
      - ./config:/app/config
      # Optional: mount for custom locales
      # - ./locales:/app/locales:ro
    environment:
      - TZ=Europe/Amsterdam
      # Optional: disable authentication for initial setup
      # - REQUESTRR_DISABLE_AUTH=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4545/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# =============================================================================
# Unraid Users:
# =============================================================================
# 1. Change the volume path to: /mnt/user/appdata/controlarr/config:/app/config
# 2. Set your timezone in the TZ environment variable
# 3. Access via: http://your-unraid-ip:4545
# =============================================================================
